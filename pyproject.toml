[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-selection-probe"
version = "0.1.0"
description = "Detect tool-selection scaling limits — semantic confusion pairs, phase-transition scale prediction (~60 tools, ~0.55 cosine threshold). Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "wwb-bill" }]
keywords = ["tool-selection", "routing", "scale", "confusion", "agents", "mcp"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tool-selection-probe = "tool_selection_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
